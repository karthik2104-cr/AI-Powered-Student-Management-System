<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login · Student Management System</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="auth-layout single">
    <section class="auth-card">
      <p class="eyebrow"><a href="/">Student Management System</a></p>
      <h1>Administrator login</h1>
      <p class="hint">Use the academic office account. Student registration cannot create this role.</p>
      <form id="login-form" data-portal="admin">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <div class="button-row"><button type="submit">Sign in</button></div>
      </form>
      <p id="login-message" class="message" role="status"></p>
      <p class="hint"><a href="/">Back to the welcome page</a></p>
    </section>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
